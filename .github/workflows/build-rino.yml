name: build-rino

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze the new page only
        run: flutter analyze lib/features/model/pages/local_models_page.dart || true

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rino-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
